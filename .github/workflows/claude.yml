name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # Read-only is enough, though the upstream example grants write: Claude pushes
    # and comments with the Claude GitHub App's token, which the action fetches
    # through id-token. This job's own token only checks out the code and reads
    # CI results.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: at depth 1, origin/main...HEAD has no merge base once
          # main has moved past the point where the PR branch last met it.
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # `@claude /code-review` on a pull request asks for Claude Code's
          # built-in review. Under this longer trigger phrase the rest of the
          # comment (an effort level such as `medium`, or nothing) reaches Claude
          # as plain text, and the appended prompt below has Claude run the review
          # with the Skill tool and post its findings in Claude's comment (and
          # inline too, with `--comment`). Under the plain `@claude` phrase the
          # action would hand `/code-review` to Claude Code as a slash command,
          # which runs the review before Claude's own turn starts and leaves its
          # report out of the comment.
          trigger_phrase: ${{ contains(github.event.comment.body || github.event.review.body || '', '@claude /code-review') && '@claude /code-review' || '@claude' }}

          # The review runs as a separate sub-session that skips its own
          # `--comment` step, so Claude posts the inline comments itself.
          # Other options: https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # and https://code.claude.com/docs/en/cli-reference
          claude_args: |
            --allowedTools "Skill(code-review),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "When the trigger phrase is '@claude /code-review', the comment asks for Claude Code's built-in code review of this pull request. Run it with the Skill tool: skill code-review, with the text after the trigger phrase (an effort level such as medium, other options, or nothing; leave out --comment, which is handled below) followed by the target origin/BASE...HEAD as its arguments, where BASE is the pull request's base branch from the context (usually main). Do not review the code yourself. When the skill returns: if the text after the trigger phrase includes --comment, first post each finding as an inline comment on its file and line with mcp__github_inline_comment__create_inline_comment, with confirmed set to true. Then post the skill's findings in your tracking comment with mcp__github_comment__update_claude_comment, in this form and nothing else: a heading, then one numbered item per finding in the skill's order, giving its file and line and the skill's own wording of the issue and its failure scenario. Add no introduction, verdict, fix, priority or summary of your own. If it found nothing, say so in one line."

