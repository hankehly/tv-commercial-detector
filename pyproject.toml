[project]
name = "tv-commercial-detector"
version = "0.1.0"
description = "Detect whether a TV commercial is playing in a live audio/video stream"
readme = "README.md"
authors = [
    { name = "hankehly", email = "henry.ehly@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "loguru>=0.7.3",
]

[project.scripts]
tv-commercial-detector = "tv_commercial_detector:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D", "T20", "TID251", "PD"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use loguru: `from loguru import logger`"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
